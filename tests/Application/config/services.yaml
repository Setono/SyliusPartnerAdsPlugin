# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: en_US

services:
    # Replace the real Partner Ads HTTP client with a logging test double so the test
    # application never makes real outbound requests.
    Setono\SyliusPartnerAdsPlugin\Tests\Application\Client\Client:
        arguments:
            - '@Setono\SyliusPartnerAdsPlugin\UrlProvider\NotifyUrlProviderInterface'
            - '@logger'

    Setono\SyliusPartnerAdsPlugin\Client\ClientInterface:
        alias: Setono\SyliusPartnerAdsPlugin\Tests\Application\Client\Client
